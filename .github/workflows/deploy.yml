name: Deploy to NAS

on:
  push:
    branches:
      - main

concurrency:
  group: outsystems-exam-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Install cloudflared
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat >> ~/.ssh/config << EOF
          Host ssh.kckworld.com
              ProxyCommand cloudflared access ssh --hostname %h
              User kck9010
              StrictHostKeyChecking no
          EOF

      - name: Pull and restart on NAS
        run: |
          ssh ssh.kckworld.com "cd /volume1/docker/outsystems-exam && git pull origin main && sudo /usr/local/bin/docker compose up -d --build app"
